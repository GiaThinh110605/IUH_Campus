services:
  iuh-guardian-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "5001"
      PROMETHEUS_MULTIPROC_DIR: /tmp/iuh-guardian-prometheus
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
