name: CI FOR BACKEND

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirement
        run: python -m pip install -r Server/requirements.txt -r Server/requirements-dev.txt

      - name: Run test
        run: python -m pytest Server/tests -q
